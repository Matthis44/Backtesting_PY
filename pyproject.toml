[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtester"
version = "1.0.0"
description = "Event-driven backtesting engine with a MySQL securities master"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matthis Guerin" }]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
data = ["yfinance>=0.2", "requests>=2.31", "lxml>=5.0"]
mysql = ["SQLAlchemy>=2.0", "mysql-connector-python>=8.0", "python-dotenv>=1.0"]
live = ["python-binance>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["backtester*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
